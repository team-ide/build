name: build-golang-arm64
on:
  push:
    branches:
      - main
    paths: [ "Dockerfile-build-golang-arm64", ".github/workflows/build-golang-arm64.yml" ]
jobs:
  build-golang-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker Build
        run: docker build --platform=linux/arm64 -f Dockerfile-build-golang-arm64 -t teamide/build-golang:arm64-1.24.10 .
      - name: Docker Push
        run: docker push teamide/build-golang:arm64-1.24.10
