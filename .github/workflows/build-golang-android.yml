name: build-golang-android
on:
  push:
    branches:
      - main
    paths: [ "Dockerfile-build-golang-amd64", ".github/workflows/build-golang-android.yml" ]
jobs:
  build-golang-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker Build
        run: docker build -f Dockerfile-build-golang-android -t teamide/build-golang-android:1.24.10-r28c .
      - name: Docker Push
        run: docker push teamide/build-golang-android:1.24.10-r28c
